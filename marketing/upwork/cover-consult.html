<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Upwork cover, consultation</title>
<!-- Upwork Project Catalog cover for the consultation listing. Not part of the site build. Render with: node marketing/upwork/render.mjs cover-consult -->
<link rel="stylesheet" href="/src/styles/fonts.css" />
<link rel="stylesheet" href="/src/styles/tokens.css" />
<style>
  :root {
    --panel: var(--paper-2);
    --win: var(--paper);
    --win-bar: color-mix(in srgb, var(--paper-2) 55%, var(--paper));
    --ui: var(--ink);
    --ui-faint: var(--ink-faint);
    --good: var(--accent-text);
    --pencil: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: var(--surface);
      --win: var(--bg);
      --win-bar: var(--band);
      --ui: var(--paper);
      --ui-faint: color-mix(in srgb, var(--paper) 40%, var(--night));
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; }
  body { position: relative; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  h1 { position: absolute; left: 90px; top: 84px; font-size: 156px; line-height: 1.0; font-weight: 700; letter-spacing: -0.04em; white-space: nowrap; }
  h1 em { font-style: italic; font-weight: 400; color: var(--text-display); }
  .sub { position: absolute; left: 98px; top: 430px; font-family: var(--mono); font-weight: 500; font-size: 42px; letter-spacing: 0.01em; color: var(--text-2); }

  .panel { position: absolute; left: 64px; right: 64px; top: 552px; bottom: 64px; border-radius: 32px; background: var(--panel); }
  .art { position: absolute; inset: 0; }
</style>
</head>
<body>
  <h1>Is your AI-built app<br /><em>ready to launch?</em></h1>
  <p class="sub">30-minute screen-share review</p>

  <div class="panel"></div>
  <svg class="art" id="art" viewBox="0 0 1600 1200" width="1600" height="1200" aria-hidden="true"></svg>

<script>
// Seeded random, so every render draws the same sketch.
let seed = 11;
const rand = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const j = (r) => (rand() * 2 - 1) * r;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.append(e); return e; };

// A pencil line: drawn twice with small wobbles, like a quick sketch.
function roughLine(g, x1, y1, x2, y2, o = {}) {
  const w = o.w ?? 3.4, col = o.col ?? 'var(--pencil)', op = o.op ?? 0.72, passes = o.passes ?? 2;
  for (let p = 0; p < passes; p++) {
    const len = Math.hypot(x2 - x1, y2 - y1), r = Math.min(3.5, len / 40) + 0.8;
    const mx = x1 + (x2 - x1) * (0.45 + j(0.1)), my = y1 + (y2 - y1) * (0.45 + j(0.1));
    const nx = -(y2 - y1) / len, ny = (x2 - x1) / len, bow = j(len / 60 + 1.2);
    el('path', { d: `M ${x1 + j(r)} ${y1 + j(r)} Q ${mx + nx * bow} ${my + ny * bow} ${x2 + j(r)} ${y2 + j(r)}`, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', opacity: op, 'stroke-dasharray': o.dash ?? 'none' }, g);
  }
}
function roughRect(g, x, y, w, h, o = {}) {
  const ov = 5;
  roughLine(g, x - ov * rand(), y, x + w + ov * rand(), y, o);
  roughLine(g, x + w, y - ov * rand(), x + w, y + h + ov * rand(), o);
  roughLine(g, x + w + ov * rand(), y + h, x - ov * rand(), y + h, o);
  roughLine(g, x, y + h + ov * rand(), x, y - ov * rand(), o);
}
function squiggle(g, x, y, len, o = {}) {
  let d = '';
  for (let i = 0; i <= 30; i++) { const px = x + (len * i) / 30, py = y + Math.sin(i * 1.15 + (o.ph ?? 0)) * (o.amp ?? 5) + Math.sin(i * 0.4) * 2; d += (i ? ' L ' : 'M ') + px.toFixed(1) + ' ' + py.toFixed(1); }
  el('path', { d, fill: 'none', stroke: o.col ?? 'var(--pencil)', 'stroke-width': o.w ?? 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: o.op ?? 0.6 }, g);
}

const art = document.getElementById('art');
const defs = el('defs', {}, art);
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const f = el('filter', { id: 'sheet', x: '-20%', y: '-20%', width: '140%', height: '150%' }, defs);
el('feDropShadow', { dx: 0, dy: 10, stdDeviation: 12, 'flood-color': 'black', 'flood-opacity': dark ? 0.4 : 0.16 }, f);
const fw = el('filter', { id: 'win', x: '-20%', y: '-20%', width: '140%', height: '150%' }, defs);
el('feDropShadow', { dx: 0, dy: 18, stdDeviation: 22, 'flood-color': 'black', 'flood-opacity': dark ? 0.45 : 0.14 }, fw);

// A head-and-shoulders silhouette for a video tile.
function person(g, cx, cy, s, col) {
  el('circle', { cx, cy: cy - 20 * s, r: 24 * s, fill: col }, g);
  el('path', { d: `M ${cx - 46 * s} ${cy + 48 * s} Q ${cx - 44 * s} ${cy + 10 * s} ${cx} ${cy + 10 * s} Q ${cx + 44 * s} ${cy + 10 * s} ${cx + 46 * s} ${cy + 48 * s} Z`, fill: col }, g);
}

// ── Left: a video call, with an app shared on screen.
{
  const X = 112, Y = 640, W = 880, H = 448;
  const g = el('g', { transform: `translate(${X} ${Y})` }, art);
  el('rect', { x: 0, y: 0, width: W, height: H, rx: 22, fill: 'var(--win)', filter: 'url(#win)' }, g);
  const clip = el('clipPath', { id: 'wc' }, defs); el('rect', { x: 0, y: 0, width: W, height: H, rx: 22 }, clip);
  const c = el('g', { 'clip-path': 'url(#wc)' }, g);
  // title bar
  el('rect', { x: 0, y: 0, width: W, height: 58, fill: 'var(--win-bar)' }, c);
  [32, 56, 80].forEach((cx) => el('circle', { cx, cy: 29, r: 7.5, fill: 'var(--ui-faint)', opacity: 0.7 }, c));
  el('rect', { x: 340, y: 23, width: 200, height: 12, rx: 6, fill: 'var(--ui-faint)', opacity: 0.8 }, c);

  // the shared screen: a small app inside the call
  const SX = 18, SY = 76, SW = 626, SH = 270;
  el('rect', { x: SX, y: SY, width: SW, height: SH, rx: 12, fill: 'var(--win-bar)' }, c);
  const ax = SX + 16, ay = SY + 16, aw = SW - 32, ah = SH - 32;
  el('rect', { x: ax, y: ay, width: aw, height: ah, rx: 8, fill: 'var(--win)' }, c);
  el('rect', { x: ax, y: ay, width: 96, height: ah, fill: 'var(--win-bar)', opacity: 0.7 }, c);
  el('rect', { x: ax + 18, y: ay + 18, width: 24, height: 24, rx: 6, fill: 'var(--accent)' }, c);
  [0, 1, 2, 3].forEach((i) => el('rect', { x: ax + 18, y: ay + 64 + i * 32, width: i === 0 ? 58 : 44 + (i % 2) * 14, height: 9, rx: 4.5, fill: i === 0 ? 'var(--good)' : 'var(--ui-faint)', opacity: i === 0 ? 1 : 0.8 }, c));
  el('rect', { x: ax + 120, y: ay + 22, width: 150, height: 15, rx: 7.5, fill: 'var(--ui)' }, c);
  el('rect', { x: ax + 120, y: ay + 48, width: 210, height: 9, rx: 4.5, fill: 'var(--ui-faint)', opacity: 0.8 }, c);
  // three cards
  for (let i = 0; i < 3; i++) {
    const cx = ax + 120 + i * 150, cy = ay + 80;
    el('rect', { x: cx, y: cy, width: 134, height: 82, rx: 8, fill: 'var(--panel)' }, c);
    el('rect', { x: cx + 14, y: cy + 16, width: 60, height: 9, rx: 4.5, fill: 'var(--ui-faint)', opacity: 0.9 }, c);
    el('rect', { x: cx + 14, y: cy + 40, width: 84 - i * 14, height: 16, rx: 8, fill: 'var(--ui)', opacity: 0.8 }, c);
  }
  // two rows
  for (let i = 0; i < 2; i++) {
    const ry = ay + 182 + i * 26;
    el('rect', { x: ax + 120, y: ry, width: 260 - i * 60, height: 9, rx: 4.5, fill: 'var(--ui-faint)', opacity: 0.8 }, c);
    el('circle', { cx: ax + aw - 30, cy: ry + 4.5, r: 6, fill: 'var(--good)' }, c);
  }
  // the reviewer points at one card
  const card = { x: ax + 270, y: ay + 80 };
  el('rect', { x: card.x - 7, y: card.y - 7, width: 148, height: 96, rx: 12, fill: 'none', stroke: 'var(--good)', 'stroke-width': 5 }, c);
  const cur = el('g', { transform: `translate(${card.x + 112} ${card.y + 60}) rotate(-8)` }, c);
  el('path', { d: 'M 0 0 L 0 40 L 10 30 L 18 48 L 26 44 L 18 27 L 32 27 Z', fill: 'var(--ui)', stroke: 'var(--win)', 'stroke-width': 3, 'stroke-linejoin': 'round' }, cur);

  // two video tiles
  const TX = SX + SW + 18, TW = W - TX - 18, TH = (SH - 18) / 2;
  [
    { y: SY, bg: 'var(--accent)', fg: 'var(--paper)' },
    { y: SY + TH + 18, bg: 'var(--paper-3)', fg: 'var(--accent-deep)' },
  ].forEach((t) => {
    el('rect', { x: TX, y: t.y, width: TW, height: TH, rx: 12, fill: t.bg }, c);
    const tg = el('g', {}, c);
    el('clipPath', { id: `t${t.y}` }, defs).append(el('rect', { x: TX, y: t.y, width: TW, height: TH, rx: 12 }));
    tg.setAttribute('clip-path', `url(#t${t.y})`);
    person(tg, TX + TW / 2, t.y + TH / 2 + 8, 1, t.fg);
  });

  // call controls
  const cy = H - 42;
  el('rect', { x: 0, y: H - 84, width: W, height: 84, fill: 'var(--win-bar)' }, c);
  const btn = (cx, fill) => el('circle', { cx, cy, r: 26, fill }, c);
  // mic
  btn(W / 2 - 126, 'var(--win)');
  el('rect', { x: W / 2 - 133, y: cy - 15, width: 14, height: 22, rx: 7, fill: 'var(--ui)' }, c);
  el('path', { d: `M ${W / 2 - 138} ${cy} Q ${W / 2 - 138} ${cy + 13} ${W / 2 - 126} ${cy + 13} Q ${W / 2 - 114} ${cy + 13} ${W / 2 - 114} ${cy} M ${W / 2 - 126} ${cy + 13} V ${cy + 18}`, fill: 'none', stroke: 'var(--ui)', 'stroke-width': 3, 'stroke-linecap': 'round' }, c);
  // camera
  btn(W / 2 - 42, 'var(--win)');
  el('rect', { x: W / 2 - 58, y: cy - 10, width: 22, height: 20, rx: 4, fill: 'var(--ui)' }, c);
  el('path', { d: `M ${W / 2 - 34} ${cy - 3} L ${W / 2 - 25} ${cy - 9} V ${cy + 9} L ${W / 2 - 34} ${cy + 3} Z`, fill: 'var(--ui)' }, c);
  // screen share, switched on
  btn(W / 2 + 42, 'var(--good)');
  el('rect', { x: W / 2 + 28, y: cy - 12, width: 28, height: 20, rx: 3, fill: 'none', stroke: 'var(--win)', 'stroke-width': 3 }, c);
  el('path', { d: `M ${W / 2 + 42} ${cy + 3} V ${cy - 6} M ${W / 2 + 37} ${cy - 2} L ${W / 2 + 42} ${cy - 7} L ${W / 2 + 47} ${cy - 2} M ${W / 2 + 36} ${cy + 13} H ${W / 2 + 48}`, fill: 'none', stroke: 'var(--win)', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, c);
  // more
  btn(W / 2 + 126, 'var(--win)');
  [-10, 0, 10].forEach((dx) => el('circle', { cx: W / 2 + 126 + dx, cy, r: 3.6, fill: 'var(--ui)' }, c));
}

// ── Right: the checklist, on a paper sheet like the hero's. Ticks use accent-deep,
// like the sticky note, because the paper stays light in dark mode too.
{
  const g = el('g', { transform: 'translate(1050 624) rotate(3 200 232)' }, art);
  el('rect', { x: 0, y: 0, width: 400, height: 464, fill: 'var(--paper)', filter: 'url(#sheet)' }, g);
  el('rect', { x: 0, y: 0, width: 400, height: 26, fill: 'var(--paper-3)' }, g);
  squiggle(g, 36, 74, 190, { w: 6, amp: 4, op: 0.8 });
  roughLine(g, 32, 100, 368, 98, { w: 2.6, op: 0.4, passes: 1 });
  const rows = [150, 216, 282, 348, 414];
  const lens = [214, 176, 228, 160, 196];
  rows.forEach((y, i) => {
    roughRect(g, 36, y - 20, 40, 40, { w: 3.2 });
    squiggle(g, 100, y, lens[i], { ph: i * 1.3, w: 4.2 });
    if (i < 4) el('path', { d: `M ${42 + j(2)} ${y - 2 + j(2)} L ${56 + j(2)} ${y + 14 + j(2)} L ${86 + j(2)} ${y - 26 + j(2)}`, fill: 'none', stroke: 'var(--accent-deep)', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  });
}
</script>

<!-- The 30 minute badge sits on top of the call window's corner. -->
<style>
  .badge { position: absolute; left: 778px; top: 600px; display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 32px 0 24px; border-radius: 38px; background: var(--accent-text); color: var(--bg); font-size: 40px; font-weight: 700; letter-spacing: -0.01em; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); }
  .badge svg { width: 34px; height: 34px; }
</style>
<div class="badge"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="currentColor" stroke-width="4" /><path d="M 17 9 V 17 L 23 21" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>30 min</div>
</body>
</html>
