<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Portfolio image</title>
<!-- Portfolio images for Upwork and Google Business Profile. Not part of the site build.
     Render with: node marketing/portfolio/render.mjs
     ?slug=chen          one project: desktop in a browser frame, plus the phone view
     ?slug=werla&ba=1    WERLA before and after the redesign
     The address bar stays blank: no URLs, logo, or contact info (Upwork rule). -->
<link rel="stylesheet" href="/src/styles/fonts.css" />
<link rel="stylesheet" href="/src/styles/tokens.css" />
<style>
  :root { color-scheme: light; --shadow: rgba(26, 36, 32, 0.08); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; }
  body { position: relative; background: var(--paper); font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }

  .browser { position: absolute; border: 1.5px solid var(--line-strong); border-radius: 14px; overflow: hidden; background: var(--paper); box-shadow: 14px 18px 0 var(--shadow); }
  .bar { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 18px; background: var(--paper-2); border-bottom: 1.5px solid var(--line-strong); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); opacity: 0.7; }
  .bar b { margin-left: 14px; width: 34%; height: 18px; border-radius: 9px; background: var(--paper); opacity: 0.85; }
  .browser img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }

  .phone { position: absolute; border: 9px solid var(--ink); border-radius: 34px; overflow: hidden; background: var(--ink); box-shadow: 14px 18px 0 var(--shadow); }
  .phone img { display: block; width: 100%; aspect-ratio: 390 / 844; object-fit: cover; object-position: top; border-radius: 25px; }

  .tag { position: absolute; display: inline-flex; align-items: center; height: 64px; padding: 0 30px; border-radius: 32px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .tag.before { background: var(--paper-2); color: var(--ink); }
  .tag.after { background: var(--accent-deep); color: var(--paper); }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const slug = q.get('slug');
  const src = (name) => `raw/${name}.png`;
  const browser = (img, x, y, w) => `<div class="browser" style="left:${x}px;top:${y}px;width:${w}px"><div class="bar"><i></i><i></i><i></i><b></b></div><img src="${src(img)}" alt=""></div>`;
  const phone = (img, x, y, w) => `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px"><img src="${src(img)}" alt=""></div>`;
  const tag = (kind, text, x, y) => `<span class="tag ${kind}" style="left:${x}px;top:${y}px">${text}</span>`;

  document.body.innerHTML = q.get('ba')
    ? // Two rows: the old theme, then the new one, each with its phone view.
      browser(`${slug}-before-desktop`, 60, 40, 820) + phone(`${slug}-before-mobile`, 944, 40, 254) + tag('before', 'Before', 1262, 282) +
      tag('after', 'After', 64, 854) + phone(`${slug}-mobile`, 380, 612, 254) + browser(`${slug}-desktop`, 720, 612, 820)
    : // One project: the desktop view, with the phone view overlapping its corner.
      browser(`${slug}-desktop`, 80, 162, 1240) + phone(`${slug}-mobile`, 1214, 362, 316);

  Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => { document.documentElement.dataset.ready = 'true'; });
</script>
</body>
</html>
