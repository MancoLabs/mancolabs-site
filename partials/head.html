<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1F2320" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/brand/mancolabs-logo.svg" />
  <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/dm-sans-latin-500.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    (function (d, q, n) {
      d.className = d.className.replace('no-js', 'js reveal-armed');
      setTimeout(function () { if (!('ready' in d.dataset)) d.classList.remove('reveal-armed'); }, 3000);
      // 3D: "pending" means try it once the page is idle; "off" means keep the poster.
      var c = n.connection || {};
      // Firefox on phones resizes the page while its toolbar slides, which blanked
      // and redrew the 3D, so it always gets the drawings. Firefox for iOS says
      // "FxiOS" (it runs on WebKit); Firefox for Android says "Android ... Firefox/".
      var ua = n.userAgent;
      var ffMobile = /FxiOS\//.test(ua) ? 'Firefox for iOS' : /Android/.test(ua) && /Firefox\//.test(ua) ? 'Firefox for Android' : '';
      d.setAttribute('data-ua-match', ffMobile || 'none');
      var forced = /[?&](poster|og|3d=on|3d=force-webgl)\b/.test(q);
      var skip = /[?&]3d=off\b/.test(q) || !!ffMobile ||
        matchMedia('(prefers-reduced-motion: reduce)').matches ||
        c.saveData || /2g/.test(c.effectiveType || '') ||
        ('deviceMemory' in n && (n.deviceMemory < 4 || n.hardwareConcurrency < 4));
      d.setAttribute('data-3d', forced || !skip ? 'pending' : 'off');
      if (/[?&]og\b/.test(q)) d.classList.add('og-mode');
      // Firefox on phones: its toolbar changes the viewport height while it slides,
      // which moved the page. Hold the height from load (see main.css), and only
      // take a new one when the width changes (the phone turned).
      if (ffMobile) {
        d.classList.add('ff-mobile');
        var fw = innerWidth;
        d.style.setProperty('--fx-vh', innerHeight + 'px');
        addEventListener('resize', function () {
          if (innerWidth === fw) return;
          fw = innerWidth;
          d.style.setProperty('--fx-vh', innerHeight + 'px');
        });
      }
    })(document.documentElement, location.search, navigator);
  </script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script type="module" src="/src/main.js"></script>
