<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A2420" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/brand/mancolabs-logo.svg" />
  <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/dm-sans-latin-500.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    (function (d, q, n) {
      d.className = d.className.replace('no-js', 'js reveal-armed');
      setTimeout(function () { if (!('ready' in d.dataset)) d.classList.remove('reveal-armed'); }, 3000);
      // 3D: "pending" means try it once the page is idle; "off" means keep the poster.
      var c = n.connection || {};
      // Firefox for Android blanks and redraws the 3D every time its toolbar
      // slides, so it always gets the drawings.
      var ffAndroid = /Android/.test(n.userAgent) && /Firefox\//.test(n.userAgent);
      var forced = /[?&](poster|og|3d=on|3d=force-webgl)\b/.test(q);
      var skip = /[?&]3d=off\b/.test(q) || ffAndroid ||
        matchMedia('(prefers-reduced-motion: reduce)').matches ||
        c.saveData || /2g/.test(c.effectiveType || '') ||
        ('deviceMemory' in n && (n.deviceMemory < 4 || n.hardwareConcurrency < 4));
      d.setAttribute('data-3d', forced || !skip ? 'pending' : 'off');
      if (/[?&]og\b/.test(q)) d.classList.add('og-mode');
      // Firefox for Android: its toolbar can resize viewport units while it slides,
      // which moved the page. Hold them at the height on load (see main.css), and
      // only take a new one when the width changes (the phone turned).
      if (ffAndroid) {
        d.classList.add('ff-android');
        var fw = innerWidth;
        d.style.setProperty('--fx-vh', innerHeight + 'px');
        addEventListener('resize', function () {
          if (innerWidth === fw) return;
          fw = innerWidth;
          d.style.setProperty('--fx-vh', innerHeight + 'px');
        });
      }
    })(document.documentElement, location.search, navigator);
  </script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script type="module" src="/src/main.js"></script>
